name: Test missing required input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required project_key input
        id: action
        uses: .
        with:
          # project_key is intentionally omitted — it is required
          api_host: example.backlog.com
          api_key: fake-api-key-for-testing
        continue-on-error: true

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required input 'project_key' is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required input was missing"
