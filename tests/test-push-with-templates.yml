name: Test push event with custom templates and keywords
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_key: MYPROJECT
          api_host: myspace.backlog.jp
          api_key: fake-api-key-for-testing
          fix_keywords: "fixes,fixed"
          close_keywords: "closes,closed"
          push_comment_template: "Commit pushed: {{message}}"
          commit_message_reg_template: "([A-Z]+-[0-9]+)"
          fix_status_id: "3"
          close_status_id: "4"
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert action ran with custom template inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected success or failure"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key and custom templates)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
