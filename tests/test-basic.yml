name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_key: TEST
          api_host: example.backlog.com
          api_key: fake-api-key-for-testing
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert action ran and failed gracefully with invalid credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed (unlikely with fake key) or fail gracefully
          # It must not be 'skipped' — that would indicate a setup problem
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected success or failure"
            exit 1
          fi
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake API key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
