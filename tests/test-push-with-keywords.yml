name: Test push with fix and close keywords
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create fake push event payload with fix keyword in commit
        run: |
          mkdir -p /tmp/github-events
          cat > /tmp/github-events/push-fix.json << 'EOF'
          {
            "ref": "refs/heads/main",
            "before": "0000000000000000000000000000000000000000",
            "after": "2222222222222222222222222222222222222222",
            "repository": {
              "full_name": "test-org/test-repo",
              "html_url": "https://github.com/test-org/test-repo"
            },
            "pusher": {
              "name": "test-user"
            },
            "commits": [
              {
                "id": "2222222222222222222222222222222222222222",
                "message": "fixes TEST-789 resolve the bug",
                "url": "https://github.com/test-org/test-repo/commit/2222222222222222222222222222222222222222",
                "author": {
                  "name": "Test User",
                  "email": "test@example.com"
                },
                "timestamp": "2024-01-01T00:00:00Z"
              }
            ],
            "compare": "https://github.com/test-org/test-repo/compare/main"
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-events/push-fix.json" >> $GITHUB_ENV

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_key: TEST
          api_host: example.backlog.com
          api_key: fake-api-key-for-testing
          fix_keywords: fixes,fixed
          close_keywords: closes,closed
          fix_status_id: "4"
          close_status_id: "5"
          push_comment_template: "Pushed by {{pusher}}: {{message}}"
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
          GITHUB_EVENT_PATH: /tmp/github-events/push-fix.json

      - name: Assert action ran with optional keyword inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail due to API error (not setup error)
          # Both 'success' and 'failure' are acceptable — what matters is the action ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
